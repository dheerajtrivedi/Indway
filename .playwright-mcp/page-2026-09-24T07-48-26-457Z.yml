    - generic [ref=f7e21]:
      - generic [ref=f7e22]:
        - heading "One factory, the full LT range." [level=2] [ref=f7e23]
        - paragraph [ref=f7e24]: Every lineup starts from your single-line diagram and load list. We size busbars, breakers and enclosures to your fault level, then build to IEC 61439 and IS 8623.
      - list [ref=f7e25]:
        - listitem [ref=f7e26]:
          - heading "Power control centre PCC" [level=3] [ref=f7e27]:
            - text: Power control centre
            - generic [ref=f7e28]: PCC
          - paragraph [ref=f7e29]: Main incoming and distribution from transformer and DG sources, with ACB incomers, bus couplers and interlocking.
          - generic [ref=f7e30]: Up to 6300 A
        - listitem [ref=f7e31]:
          - heading "Motor control centre MCC" [level=3] [ref=f7e32]:
            - text: Motor control centre
            - generic [ref=f7e33]: MCC
          - paragraph [ref=f7e34]: DOL, star-delta, soft starter and VFD feeders in fixed or drawout modules, with remote control and status wiring.
          - generic [ref=f7e35]: Up to 4000 A
        - listitem [ref=f7e36]:
          - heading "Power factor correction APFC" [level=3] [ref=f7e37]:
            - text: Power factor correction
            - generic [ref=f7e38]: APFC
          - paragraph [ref=f7e39]: Automatic capacitor banks with a relay controller, detuned reactors and contactor switching to cut reactive power charges.
          - generic [ref=f7e40]: 50 to 1000 kVAr
        - listitem [ref=f7e41]:
          - heading "Distribution boards MLDB, PDB, SDB" [level=3] [ref=f7e42]:
            - text: Distribution boards
            - generic [ref=f7e43]: MLDB, PDB, SDB
          - paragraph [ref=f7e44]: Main and sub distribution for lighting and power circuits in buildings, hospitals and campuses.
          - generic [ref=f7e45]: Up to 1600 A
        - listitem [ref=f7e46]:
          - heading "AMF and synchronising DG panels" [level=3] [ref=f7e47]:
            - text: AMF and synchronising
            - generic [ref=f7e48]: DG panels
          - paragraph [ref=f7e49]: Automatic mains failure changeover and multi-DG synchronising with load sharing controllers.
          - generic [ref=f7e50]: Up to 4000 A
        - listitem [ref=f7e51]:
          - heading "Feeder pillars Outdoor" [level=3] [ref=f7e52]:
            - text: Feeder pillars
            - generic [ref=f7e53]: Outdoor
          - paragraph [ref=f7e54]: Weatherproof enclosures for street lighting, townships and site distribution.
          - generic [ref=f7e55]: IP55 enclosure
