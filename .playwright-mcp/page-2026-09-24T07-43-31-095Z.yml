            - text: Power factor correction
            - generic [ref=f4e50]: APFC
          - paragraph [ref=f4e51]: Automatic capacitor banks with a relay controller, detuned reactors and contactor switching to cut reactive power charges.
          - generic [ref=f4e52]: 50 to 1000 kVAr
        - listitem [ref=f4e53]:
          - heading "Distribution boards MLDB, PDB, SDB" [level=3] [ref=f4e54]:
            - text: Distribution boards
            - generic [ref=f4e55]: MLDB, PDB, SDB
          - paragraph [ref=f4e56]: Main and sub distribution for lighting and power circuits in buildings, hospitals and campuses.
          - generic [ref=f4e57]: Up to 1600 A
        - listitem [ref=f4e58]:
