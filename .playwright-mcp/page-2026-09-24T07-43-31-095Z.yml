          - generic [ref=f4e42]: Up to 6300 A
        - listitem [ref=f4e43]:
          - heading "Motor control centre MCC" [level=3] [ref=f4e44]:
            - text: Motor control centre
            - generic [ref=f4e45]: MCC
          - paragraph [ref=f4e46]: DOL, star-delta, soft starter and VFD feeders in fixed or drawout modules, with remote control and status wiring.
          - generic [ref=f4e47]: Up to 4000 A
