          - generic [ref=f4e14]:
            - paragraph [ref=f4e15]: Indway designs and manufactures low-tension switchboards (PCC, MCC, APFC and distribution panels) for plants, commercial buildings and infrastructure. Each panel is wired, tested and documented on our floor before it ships.
