        - heading "One factory, the full LT range." [level=2] [ref=f4e35]
        - paragraph [ref=f4e36]: Every lineup starts from your single-line diagram and load list. We size busbars, breakers and enclosures to your fault level, then build to IEC 61439 and IS 8623.
