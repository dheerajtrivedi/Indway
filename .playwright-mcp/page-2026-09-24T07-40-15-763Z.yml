            - text: AMF and synchronising
            - generic [ref=f2e60]: DG panels
          - paragraph [ref=f2e61]: Automatic mains failure changeover and multi-DG synchronising with load sharing controllers.
          - generic [ref=f2e62]: Up to 4000 A
        - listitem [ref=f2e63]:
