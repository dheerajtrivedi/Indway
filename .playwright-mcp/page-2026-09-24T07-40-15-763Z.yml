            - text: Power factor correction
            - generic [ref=f2e50]: APFC
          - paragraph [ref=f2e51]: Automatic capacitor banks with a relay controller, detuned reactors and contactor switching to cut reactive power charges.
          - generic [ref=f2e52]: 50 to 1000 kVAr
        - listitem [ref=f2e53]:
          - heading "Distribution boards MLDB, PDB, SDB" [level=3] [ref=f2e54]:
            - text: Distribution boards
            - generic [ref=f2e55]: MLDB, PDB, SDB
          - paragraph [ref=f2e56]: Main and sub distribution for lighting and power circuits in buildings, hospitals and campuses.
          - generic [ref=f2e57]: Up to 1600 A
        - listitem [ref=f2e58]:
