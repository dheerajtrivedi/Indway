          - generic [ref=f2e42]: Up to 6300 A
        - listitem [ref=f2e43]:
          - heading "Motor control centre MCC" [level=3] [ref=f2e44]:
            - text: Motor control centre
            - generic [ref=f2e45]: MCC
          - paragraph [ref=f2e46]: DOL, star-delta, soft starter and VFD feeders in fixed or drawout modules, with remote control and status wiring.
          - generic [ref=f2e47]: Up to 4000 A
        - listitem [ref=f2e48]:
