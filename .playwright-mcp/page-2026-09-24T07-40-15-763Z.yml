        - generic:
          - article:
            - generic: 1 of 6
            - heading "Air circuit breaker incomer" [level=2]
            - paragraph: The ACB takes supply from your transformer or DG and protects the whole board. It racks out on its drawout chassis for maintenance, without opening the busbar chamber.
            - generic: 630 A to 6300 A, 50 kA and above
          - article:
            - generic: 2 of 6
            - heading "Metering and indication" [level=2]
            - paragraph: Multifunction meters, phase indication lamps and selector switches on the incomer door show voltage, current, power factor and energy at a glance.
            - generic: Modbus-ready meters on request
          - article:
            - generic: 3 of 6
            - heading "Busbar chamber" [level=2]
            - paragraph: Copper or aluminium busbars run the full length of the lineup in a segregated top chamber, on insulated supports sized for your short-circuit level.
            - generic: Form 2 to Form 4b separation
          - article:
            - generic: 4 of 6
            - heading "Outgoing feeders" [level=2]
            - paragraph: Each feeder has its own lockable door, protection relay and meter, so one circuit can be isolated while the rest stay live.
            - generic: MCCB or ACB outgoings
          - article:
            - generic: 5 of 6
            - heading "Motor starter modules" [level=2]
            - paragraph: Compact compartments for DOL and star-delta starters. Each module slides out on its own, so you can swap a starter without shutting down the section.
            - generic: Fixed or drawout modules
          - article:
            - generic: 6 of 6
            - heading "Ventilation and finish" [level=2]
            - paragraph: Filtered louvres keep internal temperatures in check. The CRCA steel enclosure is powder-coated, RAL 7035 unless you specify otherwise.
            - generic: IP42 to IP54 indoor enclosures
