          - generic [ref=f3e14]:
            - paragraph [ref=f3e15]: Indway designs and manufactures low-tension switchboards (PCC, MCC, APFC and distribution panels) for plants, commercial buildings and infrastructure. Each panel is wired, tested and documented on our floor before it ships.
            - generic [ref=f3e16]:
              - link "Request a quote" [ref=f3e17] [cursor=pointer]:
                - /url: "#contact"
              - link "See inside the panel" [ref=f3e18] [cursor=pointer]:
