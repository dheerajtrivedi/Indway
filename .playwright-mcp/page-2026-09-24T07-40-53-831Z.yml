            - text: Power control centre
            - generic [ref=f3e40]: PCC
          - paragraph [ref=f3e41]: Main incoming and distribution from transformer and DG sources, with ACB incomers, bus couplers and interlocking.
          - generic [ref=f3e42]: Up to 6300 A
        - listitem [ref=f3e43]:
          - heading "Motor control centre MCC" [level=3] [ref=f3e44]:
            - text: Motor control centre
            - generic [ref=f3e45]: MCC
          - paragraph [ref=f3e46]: DOL, star-delta, soft starter and VFD feeders in fixed or drawout modules, with remote control and status wiring.
          - generic [ref=f3e47]: Up to 4000 A
        - listitem [ref=f3e48]:
          - heading "Power factor correction APFC" [level=3] [ref=f3e49]:
            - text: Power factor correction
            - generic [ref=f3e50]: APFC
          - paragraph [ref=f3e51]: Automatic capacitor banks with a relay controller, detuned reactors and contactor switching to cut reactive power charges.
          - generic [ref=f3e52]: 50 to 1000 kVAr
        - listitem [ref=f3e53]:
          - heading "Distribution boards MLDB, PDB, SDB" [level=3] [ref=f3e54]:
            - text: Distribution boards
            - generic [ref=f3e55]: MLDB, PDB, SDB
          - paragraph [ref=f3e56]: Main and sub distribution for lighting and power circuits in buildings, hospitals and campuses.
          - generic [ref=f3e57]: Up to 1600 A
        - listitem [ref=f3e58]:
