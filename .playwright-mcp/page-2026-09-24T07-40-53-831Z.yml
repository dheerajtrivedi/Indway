            - text: AMF and synchronising
            - generic [ref=f3e60]: DG panels
          - paragraph [ref=f3e61]: Automatic mains failure changeover and multi-DG synchronising with load sharing controllers.
          - generic [ref=f3e62]: Up to 4000 A
        - listitem [ref=f3e63]:
          - heading "Feeder pillars Outdoor" [level=3] [ref=f3e64]:
            - text: Feeder pillars
            - generic [ref=f3e65]: Outdoor
          - paragraph [ref=f3e66]: Weatherproof enclosures for street lighting, townships and site distribution.
          - generic [ref=f3e67]: IP55 enclosure
