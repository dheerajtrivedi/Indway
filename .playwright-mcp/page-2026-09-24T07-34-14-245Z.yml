        - heading "One factory, the full LT range." [level=2] [ref=e23]
        - paragraph [ref=e24]: Every lineup starts from your single-line diagram and load list. We size busbars, breakers and enclosures to your fault level, then build to IEC 61439 and IS 8623.
      - list [ref=e25]:
        - listitem [ref=e26]:
          - heading "Power control centre PCC" [level=3] [ref=e27]:
            - text: Power control centre
            - generic [ref=e28]: PCC
          - paragraph [ref=e29]: Main incoming and distribution from transformer and DG sources, with ACB incomers, bus couplers and interlocking.
          - generic [ref=e30]: Up to 6300 A
        - listitem [ref=e31]:
          - heading "Motor control centre MCC" [level=3] [ref=e32]:
            - text: Motor control centre
            - generic [ref=e33]: MCC
          - paragraph [ref=e34]: DOL, star-delta, soft starter and VFD feeders in fixed or drawout modules, with remote control and status wiring.
          - generic [ref=e35]: Up to 4000 A
        - listitem [ref=e36]:
          - heading "Power factor correction APFC" [level=3] [ref=e37]:
            - text: Power factor correction
            - generic [ref=e38]: APFC
          - paragraph [ref=e39]: Automatic capacitor banks with a relay controller, detuned reactors and contactor switching to cut reactive power charges.
          - generic [ref=e40]: 50 to 1000 kVAr
        - listitem [ref=e41]:
          - heading "Distribution boards MLDB, PDB, SDB" [level=3] [ref=e42]:
            - text: Distribution boards
            - generic [ref=e43]: MLDB, PDB, SDB
          - paragraph [ref=e44]: Main and sub distribution for lighting and power circuits in buildings, hospitals and campuses.
          - generic [ref=e45]: Up to 1600 A
        - listitem [ref=e46]:
          - heading "AMF and synchronising DG panels" [level=3] [ref=e47]:
            - text: AMF and synchronising
            - generic [ref=e48]: DG panels
          - paragraph [ref=e49]: Automatic mains failure changeover and multi-DG synchronising with load sharing controllers.
          - generic [ref=e50]: Up to 4000 A
        - listitem [ref=e51]:
          - heading "Feeder pillars Outdoor" [level=3] [ref=e52]:
            - text: Feeder pillars
            - generic [ref=e53]: Outdoor
          - paragraph [ref=e54]: Weatherproof enclosures for street lighting, townships and site distribution.
          - generic [ref=e55]: IP55 enclosure
