        - listitem [ref=e38]:
          - heading "Power control centre PCC" [level=3] [ref=e39]:
            - text: Power control centre
            - generic [ref=e40]: PCC
          - paragraph [ref=e41]: Main incoming and distribution from transformer and DG sources, with ACB incomers, bus couplers and interlocking.
          - generic [ref=e42]: Up to 6300 A
        - listitem [ref=e43]:
          - heading "Motor control centre MCC" [level=3] [ref=e44]:
            - text: Motor control centre
            - generic [ref=e45]: MCC
          - paragraph [ref=e46]: DOL, star-delta, soft starter and VFD feeders in fixed or drawout modules, with remote control and status wiring.
          - generic [ref=e47]: Up to 4000 A
        - listitem [ref=e48]:
          - heading "Power factor correction APFC" [level=3] [ref=e49]:
            - text: Power factor correction
            - generic [ref=e50]: APFC
          - paragraph [ref=e51]: Automatic capacitor banks with a relay controller, detuned reactors and contactor switching to cut reactive power charges.
          - generic [ref=e52]: 50 to 1000 kVAr
        - listitem [ref=e53]:
          - heading "Distribution boards MLDB, PDB, SDB" [level=3] [ref=e54]:
            - text: Distribution boards
            - generic [ref=e55]: MLDB, PDB, SDB
          - paragraph [ref=e56]: Main and sub distribution for lighting and power circuits in buildings, hospitals and campuses.
          - generic [ref=e57]: Up to 1600 A
        - listitem [ref=e58]:
          - heading "AMF and synchronising DG panels" [level=3] [ref=e59]:
            - text: AMF and synchronising
            - generic [ref=e60]: DG panels
          - paragraph [ref=e61]: Automatic mains failure changeover and multi-DG synchronising with load sharing controllers.
          - generic [ref=e62]: Up to 4000 A
        - listitem [ref=e63]:
          - heading "Feeder pillars Outdoor" [level=3] [ref=e64]:
            - text: Feeder pillars
            - generic [ref=e65]: Outdoor
          - paragraph [ref=e66]: Weatherproof enclosures for street lighting, townships and site distribution.
          - generic [ref=e67]: IP55 enclosure
