          - generic [ref=e14]:
            - paragraph [ref=e15]: Indway designs and manufactures low-tension switchboards (PCC, MCC, APFC and distribution panels) for plants, commercial buildings and infrastructure. Each panel is wired, tested and documented on our floor before it ships.
            - generic [ref=e16]:
              - link "Request a quote" [ref=e17] [cursor=pointer]:
                - /url: "#contact"
              - link "See inside the panel" [ref=e18] [cursor=pointer]:
                - /url: "#inside"
